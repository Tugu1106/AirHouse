# Production stack for the internal server (10.58.152.12): self-hosted Postgres
# + the Next.js app, on one network. Nginx already forwards :80 -> :3000.
#
# Values come from ~/airhouse/.env (see .env.prod.example). Deploy with
# ~/airhouse/deploy.sh (docker compose -f docker-compose.prod.yml up -d --build).
name: airhouse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema runs automatically on first boot (empty volume only).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only the web service reaches it (db:5432).

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Admin login is auto-seeded on startup if it doesn't exist yet.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - '3000:3000'

  # One-shot admin seed (create-only). Not started by `up` — the deploy script
  # runs it explicitly: docker compose ... run --rm seed
  seed:
    image: node:22-alpine
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - 'cp /scripts/seed-admin.mjs /tmp/ && cd /tmp && npm i pg bcryptjs --no-save --silent && node seed-admin.mjs'

volumes:
  pgdata:
