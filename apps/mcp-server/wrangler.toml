name = "airlink-assets-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# OAuth token/client/grant storage. Create the namespace once with:
#   pnpm exec wrangler kv namespace create OAUTH_KV
# then paste the printed id below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "a4f23071cf194a47ba8d201dd93b5445"

# Required secrets (set with `wrangler secret put <NAME>`), never committed:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_ACTOR_ID, OAUTH_PASSWORD
#
# For local `wrangler dev`, put the same values in .dev.vars (gitignored).
